<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Loved by builders</title>
    <style>
      @property --a {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      :root {
        --accent: #22c55e;
        --bg: #0a0a0a;
        --card: #0d0d0d;
        --line: #222;
        --fg: #f5f5f5;
        --muted: #9a9a9a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      section {
        padding: 64px 0;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .pill {
        display: inline-block;
        padding: 10px 28px;
        border-radius: 999px;
        color: #1b2433;
        background: linear-gradient(90deg, #7fb6ff, #f58bb0);
        font:
          600 13px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1,
      h2 {
        font-size: clamp(38px, 7vw, 80px);
        letter-spacing: -0.05em;
        line-height: 1;
        margin: 22px 0 36px;
      }
      .ctl {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
      }
      .ctl label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ctl output {
        min-width: 34px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        accent-color: var(--accent);
      }
      input[type="color"] {
        width: 34px;
        height: 24px;
        border: 0;
        padding: 0;
        background: none;
        cursor: pointer;
      }

      /* ---------- testimonial marquee ---------- */
      .marquee {
        overflow: hidden;
        margin: 16px 0;
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent,
          #000 6%,
          #000 94%,
          transparent
        );
        mask-image: linear-gradient(
          90deg,
          transparent,
          #000 6%,
          #000 94%,
          transparent
        );
      }
      .track {
        display: flex;
        width: max-content;
        animation: slide 60s linear infinite;
      } /* 60s per loop at 1× */
      .marquee:hover .track {
        animation-play-state: paused;
      }
      .r1 .track {
        animation-direction: reverse;
      } /* row 1: left → right */
      @keyframes slide {
        to {
          transform: translateX(-50%);
        }
      } /* row 2: right → left */
      .card {
        flex: none;
        width: 380px;
        height: 200px;
        margin-right: 16px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
      }
      .who {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .av {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #0a0a0a;
      }
      .nm {
        font-weight: 600;
        line-height: 1.2;
      }
      .hd {
        color: var(--muted);
        font:
          13px ui-monospace,
          Menlo,
          monospace;
      }
      .x {
        margin-left: auto;
        color: #666;
        font-size: 20px;
      }
      .card p {
        margin: 14px 0 0;
        color: #a9a9a9;
      }

      /* ---------- org chart ---------- */
      .chart {
        background: #171717;
        border-radius: 20px;
        padding: 24px;
      }
      .box {
        position: relative;
        overflow: hidden;
        width: 100%;
      }
      .stage {
        position: absolute;
        left: 50%;
        top: 0;
        width: 900px;
        height: 420px;
        transform-origin: top left;
      }
      .lines {
        position: absolute;
        inset: 0;
        width: 900px;
        height: 420px;
      }
      .base {
        stroke: #333;
        fill: none;
        stroke-width: 2;
      }
      .flow {
        stroke: var(--accent);
        fill: none;
        stroke-width: 2;
        stroke-dasharray: 6 12;
        animation: flow 1s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -18;
        }
      }
      .node {
        position: absolute;
        width: 250px;
        height: 76px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--card);
        border: 2px solid #262626;
      }
      .node.active {
        border-color: transparent;
        box-shadow: 0 0 26px -8px var(--accent);
        animation: spin 3s linear infinite;
        background:
          linear-gradient(var(--card), var(--card)) padding-box,
          conic-gradient(from var(--a), var(--accent) 0 20%, #14301e 20% 100%)
            border-box;
      }
      @keyframes spin {
        to {
          --a: 360deg;
        }
      }
      .ic {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #171717;
        display: grid;
        place-items: center;
        color: #8a8a8a;
        font-size: 18px;
      }
      .t {
        font-weight: 600;
        font-size: 20px;
        line-height: 1.1;
      }
      .ag {
        color: var(--muted);
        font-size: 15px;
      }
      .ag::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 8px;
        border-radius: 50%;
        background: #f0a030;
      }
      .badge {
        position: absolute;
        top: -14px;
        right: 14px;
        padding: 2px 12px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-weight: 600;
        font-size: 14px;
      }

      @media (prefers-reduced-motion: reduce) {
        .track,
        .node.active,
        .flow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="wrap">
        <span class="pill">What people are saying</span>
        <h1>Loved by builders.</h1>
        <div class="ctl">
          <label
            >Row 1 speed
            <input
              type="range"
              min="0.2"
              max="4"
              step="0.1"
              value="1"
              data-row="0"
            /><output>1.0×</output></label
          >
          <label
            >Row 2 speed
            <input
              type="range"
              min="0.2"
              max="4"
              step="0.1"
              value="1"
              data-row="1"
            /><output>1.0×</output></label
          >
        </div>
      </div>
      <div class="marquee r1"><div class="track"></div></div>
      <div class="marquee r2"><div class="track"></div></div>
    </section>

    <section>
      <div class="wrap">
        <span class="pill">Org chart</span>
        <h2>Run it like a company.</h2>
        <div class="ctl">
          <label
            >Accent colour <input type="color" id="acc" value="#22c55e"
          /></label>
        </div>
        <div class="chart">
          <div class="box">
            <div class="stage">
              <svg class="lines" viewBox="0 0 900 420" aria-hidden="true">
                <path
                  class="base"
                  d="M450 96V170M145 133V170M755 133V170M145 133H755M450 246V320M255 283V320M645 283V320M255 283H645"
                />
                <path class="flow" d="M450 96V170" />
                <path class="flow" d="M450 246V283H255V320" />
                <path class="flow" d="M450 246V283H645V320" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      /* ===== EDIT ME: content ===== */
      const PEOPLE = [
        // [name, handle, quote, avatar colour] – first 5 → row 1, rest → row 2
        [
          "Aarav S.",
          "@aarav_builds",
          "Spun up my first agent team in an afternoon. The org view makes it obvious who is doing what.",
          "#7fb6ff",
        ],
        [
          "Mira L.",
          "@miralabs",
          "Finally a tool that feels like running a company, not prompting a chatbot.",
          "#f58bb0",
        ],
        [
          "Tomás R.",
          "@tomasr_dev",
          "Clean, fast and opinionated in the right places. Everyone on my team should try it.",
          "#9be7a6",
        ],
        [
          "Priya N.",
          "@priya_ships",
          "The shift from “I am prompting an AI” to “I am managing a team” is real.",
          "#ffd37f",
        ],
        [
          "Jonas K.",
          "@jonask",
          "Set it up on Friday, had a working pipeline by Monday morning.",
          "#c4b5fd",
        ],
        [
          "Lena W.",
          "@lena_codes",
          "Great taste in the details. The motion and layout feel polished from day one.",
          "#7fe0e0",
        ],
        [
          "Kofi A.",
          "@kofi_builds",
          "Dropped it into our workflow without changing anything else. It just worked.",
          "#fda4af",
        ],
        [
          "Sana M.",
          "@sanam",
          "Our students understood the idea of delegating to agents within minutes.",
          "#bef264",
        ],
        [
          "Diego F.",
          "@diegof",
          "The roadmap view alone saved us two planning meetings a week.",
          "#fdba74",
        ],
        [
          "Hana T.",
          "@hana_t",
          "Just what I was looking for. Simple to read, easy to extend.",
          "#a5b4fc",
        ],
      ];
      const NODES = [
        // title, agent, icon, x, y, active?  (stage is 900 × 420)
        { t: "CEO", a: "Atlas", i: "⌂", x: 325, y: 20 },
        { t: "CMO", a: "Nova", i: "◎", x: 20, y: 170 },
        { t: "CTO", a: "Forge", i: "⚙", x: 325, y: 170, on: 1 },
        { t: "COO", a: "Orbit", i: "▤", x: 630, y: 170 },
        { t: "Frontend Eng", a: "Pixel", i: "</>", x: 130, y: 320, on: 1 },
        { t: "Backend Eng", a: "Vector", i: "</>", x: 520, y: 320, on: 1 },
      ];

      /* ===== testimonials ===== */
      const card = ([n, h, q, c]) => `<article class="card"><div class="who">
  <div class="av" style="background:${c}">${n[0]}</div>
  <div><div class="nm">${n}</div><div class="hd">${h}</div></div><span class="x">𝕏</span></div><p>${q}</p></article>`;
      const rows = [PEOPLE.slice(0, 5), PEOPLE.slice(5)];
      const tracks = [...document.querySelectorAll(".track")];
      tracks.forEach((t, i) => {
        const h = rows[i].map(card).join("");
        t.innerHTML = h + h;
      }); // doubled = seamless loop

      /* Speed: 1× = 60 s per loop (see "animation: slide 60s" in CSS). Playback rate keeps it smooth while sliding. */
      document.querySelectorAll("input[data-row]").forEach((r) =>
        r.addEventListener("input", () => {
          const v = +r.value,
            anim = tracks[r.dataset.row].getAnimations()[0];
          if (anim) anim.updatePlaybackRate(v);
          r.nextElementSibling.textContent = v.toFixed(1) + "×";
        }),
      );

      /* ===== org chart ===== */
      const stage = document.querySelector(".stage"),
        box = document.querySelector(".box");
      NODES.forEach((n) =>
        stage.insertAdjacentHTML(
          "beforeend",
          `<div class="node${n.on ? " active" : ""}" style="left:${n.x}px;top:${n.y}px">
     <div class="ic">${n.i}</div><div><div class="t">${n.t}</div><div class="ag">${n.a}</div></div>
     ${n.on ? '<span class="badge">Active</span>' : ""}</div>`,
        ),
      );
      function fit() {
        const s = Math.min(1, box.clientWidth / 900);
        stage.style.transform = `translateX(-50%) scale(${s})`;
        box.style.height = 420 * s + "px";
      }
      addEventListener("resize", fit);
      fit();

      document
        .getElementById("acc")
        .addEventListener("input", (e) =>
          document.documentElement.style.setProperty(
            "--accent",
            e.target.value,
          ),
        );
    </script>
  </body>
</html>
